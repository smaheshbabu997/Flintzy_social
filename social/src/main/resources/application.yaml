spring:
  application:
    name: social
  datasource:
    url: jdbc:mysql://localhost:3306/flintzy_social
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
        provider:
          google:
            issuer-uri: https://accounts.google.com

jwt:
  secret: zB4fG9xR2pW5vN8mK3jL7hQ1sT0uY6cX4zB4fG9xR2pW5vN
  issuer: flintzy
  access-token-exp-minutes: 60
  refresh-token-exp-days: 7

facebook:
  app-id: ${FB_APP_ID}
  app-secret: ${FB_APP_SECRET}
  redirect-uri: http://localhost:8080/api/facebook/callback
